name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prospect
          POSTGRES_PASSWORD: prospect_ci
          POSTGRES_DB: prospect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prospect" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Create migration test database
        run: PGPASSWORD=prospect_ci psql -h localhost -U prospect -d prospect_test -c "CREATE DATABASE prospect_migrate;"
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://prospect:prospect_ci@localhost:5432/prospect_test
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://prospect:prospect_ci@localhost:5432/prospect_migrate
        run: pytest --cov=app --cov-report=term --cov-fail-under=85
      - name: Validate app starts and OpenAPI builds
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python -c "from app.main import app; import json; assert '/api/projects' in app.openapi()['paths']"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t prospect-backend ./backend
      - name: Build frontend image
        run: docker build -t prospect-frontend ./frontend
      - name: Compose config is valid
        run: POSTGRES_PASSWORD=ci docker compose config -q
