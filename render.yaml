# Render Blueprint (Infrastructure as Code). Dashboard → New → Blueprint → select this repository.
# Review plans and prices on render.com before applying; free-tier terms change over time.
databases:
  - name: prospect-db
    databaseName: prospect
    user: prospect
    plan: free

services:
  - type: web
    name: prospect-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prospect-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false          # entered in the dashboard, never committed
      - key: AUTHOR_HASH_SALT
        generateValue: true
      - key: CORS_ORIGINS
        sync: false          # e.g. https://prospect-web.onrender.com

  - type: web
    name: prospect-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # e.g. https://prospect-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
